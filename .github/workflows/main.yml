name: build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: build
        run: g++ -O2 -std=c++17 -o gdinstaller main.cpp

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gdinstaller-linux-x86_64
          path: gdinstaller
